name = "live-recorder-status"
main = "worker/src/index.js"
compatibility_date = "2024-01-01"
account_id = "<YOUR_CLOUDFLARE_ACCOUNT_ID>"

[vars]
API_BASE = "https://<YOUR_BILILIVE_API_HOST>"
# Optional: DouYin proxy for fetching real live start time (bypasses Cloudflare IP block)
# DOUYIN_PROXY_URL = "https://<YOUR_PROXY_SERVER>/douyin-proxy"
# Optional: 51.la analytics ID (omit to disable tracking)
# LA_ID = "<YOUR_51LA_ID>"

# D1 database for independent live session tracking
# Create with: npx wrangler d1 create live-sessions
# Then apply schema: npx wrangler d1 execute live-sessions --remote --file=worker/schema.sql
[[d1_databases]]
binding = "DB"
database_name = "live-sessions"
database_id = "<YOUR_D1_DATABASE_ID>"

# Poll live status every 2 minutes (writes to D1)
[triggers]
crons = ["*/2 * * * *"]

[[routes]]
pattern = "<YOUR_WORKER_ROUTE>"
zone_name = "<YOUR_ZONE_NAME>"

# PASSKEY is stored as a secret: npx wrangler secret put PASSKEY
